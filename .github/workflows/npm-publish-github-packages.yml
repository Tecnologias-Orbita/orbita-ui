name: Node.js Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --legacy-peer-deps
      - run: npm test

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/
      - run: npm -w "orbita-ui-react" i --legacy-peer-deps
      - run: npm -w "orbita-ui-react" run build
      - run: npm -w "orbita-ui-react" publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
